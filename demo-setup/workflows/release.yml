# ---------------------------------------------------------------------------
# TEMPLATE — inert until promoted to .github/workflows/release.yml.
#
# Same reasoning as demo-setup/workflows/ci.yml: kept here until
# MASTERCLASS.md's "Activate the release workflow" step copies it into
# .github/workflows/. Before that step, you also need: the ECR repos, the
# GitHub OIDC trust relationship + IAM role (demo-setup/aws/), and the
# repo's Secrets/Variables (demo-setup/github-secrets-and-variables.md) —
# none of which this file creates.
#
# Runs on every push to main (i.e. after a PR from ci.yml merges):
#   1. Authenticates to AWS via GitHub OIDC — no long-lived AWS keys stored
#      in GitHub at all.
#   2. Builds both images for linux/amd64 explicitly, matching the
#      testingfile cluster's t3.medium (amd64) worker nodes exactly — see
#      k8s/README.md's AMD64 note and the nodeSelectors in k8s/base/.
#   3. Scans each image with Trivy BEFORE it's pushed — a failed scan means
#      nothing new ever reaches ECR.
#   4. Pushes to ECR.
#   5. Updates the image tag in k8s/base/kustomization.yaml and pushes that
#      commit back to main — which is the actual trigger Argo CD's
#      automated sync reacts to (both Applications already point at this
#      repo; see k8s/argocd/application-*.yaml). Nothing in this workflow
#      talks to the Kubernetes API or to Argo CD directly — that's the
#      point of GitOps.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # step 5 pushes a commit back to this repo
  id-token: write # required for aws-actions/configure-aws-credentials OIDC
  security-events: write # Trivy SARIF upload

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false # never cancel a release mid-push to ECR

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 668484272259.dkr.ecr.us-east-2.amazonaws.com
  BACKEND_IMAGE: nexamarket-backend
  FRONTEND_IMAGE: nexamarket-frontend

jobs:
  build-scan-push:
    name: Build, scan, and push images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "image_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Set as a repo VARIABLE (not a secret) — a role ARN identifies
          # who can assume it, it doesn't grant anything by itself. See
          # demo-setup/aws/github-oidc-trust-policy.json for the trust
          # relationship this depends on, and
          # demo-setup/github-secrets-and-variables.md for where
          # AWS_OIDC_ROLE_ARN gets set.
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- backend ----
      - name: Build backend image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Explicit, not the runner's default — see this file's header
          # comment on why amd64 specifically.
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          load: true
          push: false

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.image_tag }}
          format: sarif
          output: trivy-backend-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1" # a failed scan stops the job here — nothing below runs, nothing gets pushed

      - name: Upload backend Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-image.sarif
          category: trivy-backend-image

      - name: Push backend image
        run: |
          docker push "${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.image_tag }}"
          docker push "${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest"

      # ---- frontend ----
      - name: Build frontend image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          load: true
          push: false

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.image_tag }}
          format: sarif
          output: trivy-frontend-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload frontend Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-image.sarif
          category: trivy-frontend-image

      - name: Push frontend image
        run: |
          docker push "${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.image_tag }}"
          docker push "${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest"

  update-gitops-manifests:
    name: Update image tag in Git (what Argo CD actually syncs on)
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set new image tag with yq
        uses: mikefarah/yq@v4
        with:
          cmd: |
            yq -i '
              (.images[] | select(.name == "'"${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}"'") .newTag) = "${{ needs.build-scan-push.outputs.image_tag }}" |
              (.images[] | select(.name == "'"${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}"'") .newTag) = "${{ needs.build-scan-push.outputs.image_tag }}"
            ' k8s/base/kustomization.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Image tag unchanged, nothing to commit."
            exit 0
          fi
          # [skip ci]: this push must NOT retrigger this same workflow
          # (push-to-main) or ci.yml (pull_request only, so it's already
          # unaffected) — GitHub Actions honors [skip ci] in the commit
          # message and skips every workflow run for this push.
          git commit -m "chore(gitops): deploy nexamarket@${{ needs.build-scan-push.outputs.image_tag }} [skip ci]"
          git push origin main
