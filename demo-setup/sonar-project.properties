# ---------------------------------------------------------------------------
# TEMPLATE — copy to the repo root as `sonar-project.properties` when
# activating demo-setup/workflows/ci.yml (see MASTERCLASS.md). Kept under
# demo-setup/ rather than the root until then so a stray `sonar-scanner`
# invocation (or an IDE plugin that auto-detects this file) can't point at a
# real SonarQube server before the masterclass is ready for that.
#
# See docs/sonarqube-quality-gate-recommendations.md for the reasoning
# behind every setting below, in particular sonar.newCode.referenceBranch.
# ---------------------------------------------------------------------------
sonar.projectKey=nexamarket-ecommerce
sonar.projectName=NexaMarket

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx

# New Code is graded against main, not the whole repo's history — this is
# what makes today's overall coverage numbers a non-issue for the gate as
# long as new code ships with tests. See the recommendations doc for why
# this is the single most important setting here.
sonar.newCode.referenceBranch=main
