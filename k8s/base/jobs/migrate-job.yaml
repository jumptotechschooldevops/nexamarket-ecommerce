# Runs backend/src/db/migrate.ts (compiled to dist/db/migrate.js — it ships
# in the same image as the backend Deployment, see backend/Dockerfile's
# runtime stage) against the Postgres Service. It is idempotent: migrate.ts
# tracks applied files in a schema_migrations table, so re-running it with
# nothing new to apply is a safe no-op — which matters here because the
# PreSync hook annotations make Argo CD run this Job on every sync, not
# just the first one.
#
# argocd.argoproj.io/hook: PreSync — Argo CD applies and waits for this Job
#   to succeed BEFORE syncing the rest of the Application, so new backend
#   pods never start against a schema they don't expect.
# argocd.argoproj.io/hook-delete-policy: BeforeHookCreation — the previous
#   run's (immutable, completed) Job object is deleted right before the
#   next sync creates a new one, which is what makes repeated syncs work at
#   all given Job specs can't be updated in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: nexamarket-db-migrate
  namespace: nexamarket
  labels:
    app.kubernetes.io/name: nexamarket-db-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: nexamarket
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexamarket-db-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: nexamarket
    spec:
      restartPolicy: Never
      serviceAccountName: nexamarket-migration
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "<AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/nexamarket-backend:<IMAGE_TAG>"
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - configMapRef:
                name: nexamarket-config
            - secretRef:
                name: nexamarket-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
