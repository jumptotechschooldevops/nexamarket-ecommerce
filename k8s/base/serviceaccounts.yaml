# One ServiceAccount per component rather than sharing "default":
#   - gives each workload a distinct identity for audit logs and for
#     attaching IAM permissions later via IRSA (none are needed today — no
#     component calls the AWS API or the Kubernetes API — so each one is
#     annotated with a commented-out placeholder rather than a real role).
#   - automountServiceAccountToken is false everywhere: none of these
#     workloads ever call the Kubernetes API, so there is no reason to hand
#     every pod a token that can authenticate to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexamarket-frontend
  namespace: nexamarket
  labels:
    app.kubernetes.io/name: nexamarket-frontend
    app.kubernetes.io/part-of: nexamarket
  # annotations:
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID_PLACEHOLDER>:role/nexamarket-frontend-irsa"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexamarket-backend
  namespace: nexamarket
  labels:
    app.kubernetes.io/name: nexamarket-backend
    app.kubernetes.io/part-of: nexamarket
  # annotations:
  #   # Example future use: granting the backend access to AWS Secrets
  #   # Manager or SES via IRSA instead of static Secret values.
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID_PLACEHOLDER>:role/nexamarket-backend-irsa"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexamarket-postgres
  namespace: nexamarket
  labels:
    app.kubernetes.io/name: nexamarket-postgres
    app.kubernetes.io/part-of: nexamarket
automountServiceAccountToken: false
---
# Distinct identity for the Job workloads (migration + seed) so their RBAC
# and audit trail are never confused with the long-running backend
# Deployment's ServiceAccount, even though they run the same container
# image.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexamarket-migration
  namespace: nexamarket
  labels:
    app.kubernetes.io/name: nexamarket-migration
    app.kubernetes.io/part-of: nexamarket
automountServiceAccountToken: false
