apiVersion: v1
kind: Namespace
metadata:
  name: nexamarket
  labels:
    app.kubernetes.io/name: nexamarket
    app.kubernetes.io/part-of: nexamarket
    # Pod Security Standards (built into Kubernetes 1.25+): enforce the
    # "restricted" profile at admission time, matching the non-root,
    # no-privilege-escalation securityContexts set on every workload below.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
