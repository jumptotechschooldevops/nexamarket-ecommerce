# ---------------------------------------------------------------------------
# SECRET TEMPLATES — NOT REAL CREDENTIALS.
#
# Every value below is a placeholder. This file exists so the Deployment/
# StatefulSet manifests have something concrete to reference (secretKeyRef)
# and so a reader can see exactly which keys the application expects — it is
# intentionally NOT meant to be applied as-is, and must never be committed
# to a real environment's branch with real values filled in.
#
# In the actual masterclass pipeline, replace this file's contents with one
# of (in order of preference for an EKS/Argo CD stack):
#   1. External Secrets Operator: an ExternalSecret resource that syncs from
#      AWS Secrets Manager or SSM Parameter Store into a Secret with these
#      same names/keys, so nothing sensitive ever touches Git.
#   2. Sealed Secrets (Bitnami): commit a SealedSecret CR instead — it's
#      asymmetrically encrypted and only decryptable by the controller
#      running in-cluster, so it's safe to store in Git.
#   3. At minimum, a CI step that runs `kubectl create secret ... --dry-run
#      -o yaml | kubectl apply -f -` against values pulled from a secret
#      store, never hand-edited YAML with real values.
#
# DATABASE_URL and the individual POSTGRES_* values must stay in sync with
# each other (same user/password/db) since nothing here assembles one from
# the other — a templating tool (Helm, External Secrets, Vault agent) would
# normally do that for you.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: nexamarket-postgres-credentials
  namespace: nexamarket
  labels:
    app.kubernetes.io/part-of: nexamarket
  annotations:
    nexamarket.io/secret-template: "true"
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME_nexamarket"
  POSTGRES_PASSWORD: "REPLACE_ME_use_a_generated_32+_char_secret"
  POSTGRES_DB: "REPLACE_ME_nexamarket"
---
apiVersion: v1
kind: Secret
metadata:
  name: nexamarket-backend-secrets
  namespace: nexamarket
  labels:
    app.kubernetes.io/part-of: nexamarket
  annotations:
    nexamarket.io/secret-template: "true"
type: Opaque
stringData:
  # Must match backend/src/config/env.ts: DATABASE_URL (pg connection
  # string) and JWT_SECRET (16+ chars, enforced by the app's zod schema on
  # startup — it will refuse to boot with a short one).
  #
  # postgres://<POSTGRES_USER>:<POSTGRES_PASSWORD>@<postgres-service>.<namespace>.svc.cluster.local:5432/<POSTGRES_DB>
  DATABASE_URL: "postgres://REPLACE_ME_nexamarket:REPLACE_ME_use_a_generated_32+_char_secret@nexamarket-postgres.nexamarket.svc.cluster.local:5432/REPLACE_ME_nexamarket"
  JWT_SECRET: "REPLACE_ME_generate_with_openssl_rand_base64_48"
