apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexamarket-frontend
  namespace: nexamarket
  labels:
    app.kubernetes.io/name: nexamarket-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nexamarket
spec:
  # Overridden per-overlay (production: 3, staging: configurable) — see
  # overlays/*/kustomization.yaml.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexamarket-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexamarket-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: nexamarket
    spec:
      serviceAccountName: nexamarket-frontend
      automountServiceAccountToken: false
      # See the matching comment in ../backend/deployment.yaml — same
      # reasoning, same t3.medium (amd64) worker nodes.
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nexamarket-frontend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nexamarket-frontend
      containers:
        - name: frontend
          # Account/region are real; only <IMAGE_TAG> is a placeholder —
          # see the matching comment in ../backend/deployment.yaml.
          # VITE_API_URL is baked in at image build time (see
          # frontend/Dockerfile's ARG); only BACKEND_UPSTREAM is
          # runtime-configurable, via the ConfigMap below.
          image: "668484272259.dkr.ecr.us-east-2.amazonaws.com/nexamarket-frontend:<IMAGE_TAG>"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BACKEND_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: nexamarket-config
                  key: BACKEND_UPSTREAM
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged needs to write its PID file, temp buffers
            # and generated config (from the envsubst template) somewhere —
            # these three paths cover all of it under a read-only root fs.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: etc-nginx-conf-d
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: etc-nginx-conf-d
          emptyDir: {}
