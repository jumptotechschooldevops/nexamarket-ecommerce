apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexamarket-frontend
  namespace: nexamarket
  labels:
    app.kubernetes.io/name: nexamarket-frontend
    app.kubernetes.io/part-of: nexamarket
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexamarket-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
