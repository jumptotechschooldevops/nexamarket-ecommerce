# Non-secret runtime configuration shared by the backend and frontend.
# Anything that identifies a password, token, or connection string with
# credentials belongs in secret.yaml instead — see that file's comments.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexamarket-config
  namespace: nexamarket
  labels:
    app.kubernetes.io/part-of: nexamarket
data:
  # --- backend (Node.js/Express) ---
  # Matches backend/src/config/env.ts: NODE_ENV, PORT, PGPOOL_MAX,
  # JWT_EXPIRES_IN, CORS_ORIGIN and LOG_LEVEL are all read straight from
  # process.env with these exact names.
  NODE_ENV: "production"
  PORT: "4000"
  PGPOOL_MAX: "10"
  JWT_EXPIRES_IN: "2h"
  # Must match the Ingress host (see ../base/ingress.yaml and the overlays)
  # so the backend's CORS middleware (backend/src/app.ts) accepts the
  # frontend's origin. "*" works for a demo but is intentionally overridden
  # per-overlay to the real public hostname.
  CORS_ORIGIN: "*"
  LOG_LEVEL: "info"

  # --- frontend (Nginx) ---
  # Consumed by frontend/nginx/default.conf.template via Nginx's built-in
  # envsubst templating at container start (see frontend/Dockerfile). Must
  # be "<service-name>.<namespace>.svc.cluster.local:<port>" so Nginx can
  # resolve it via in-cluster DNS.
  BACKEND_UPSTREAM: "nexamarket-backend.nexamarket.svc.cluster.local:4000"
