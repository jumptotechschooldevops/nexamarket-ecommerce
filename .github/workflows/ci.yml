# ---------------------------------------------------------------------------
# TEMPLATE — inert until promoted to .github/workflows/ci.yml.
#
# Kept under demo-setup/workflows/ on purpose so GitHub never runs this
# automatically before the masterclass activates it live (see MASTERCLASS.md,
# step "Activate CI"). Copying it to .github/workflows/ci.yml is the only
# thing that makes it live — nothing else in this file needs to change to do
# that.
#
# Runs on every pull request targeting main: lint + unit tests + integration
# tests (both packages), a SonarQube analysis of the merged coverage, and a
# Trivy filesystem scan for vulnerable dependencies. Mirrors exactly the npm
# scripts already defined in backend/package.json and frontend/package.json
# — nothing here invents a new command the repo doesn't already have.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  backend-lint-build-unit:
    name: Backend / lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Build (tsc)
        working-directory: backend
        run: npm run build

      - name: Unit tests with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  backend-integration:
    name: Backend / integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexamarket_ci
          POSTGRES_PASSWORD: ci-only-password-not-a-real-secret
          POSTGRES_DB: nexamarket_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexamarket_ci -d nexamarket_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: backend
        run: npm ci

      - name: Integration tests against the Postgres service container
        working-directory: backend
        env:
          # Not a real secret — a fixed, non-sensitive value used only to
          # satisfy backend/src/config/env.ts's JWT_SECRET length check
          # for the lifetime of this one CI job. Never used to sign a
          # token anyone relies on.
          DATABASE_URL: postgres://nexamarket_ci:ci-only-password-not-a-real-secret@localhost:5432/nexamarket_ci
          JWT_SECRET: ci-integration-test-secret-not-for-production-use
          NODE_ENV: test
        run: npm run test:integration

  frontend-lint-build-test:
    name: Frontend / lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  sonarqube:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    needs: [backend-lint-build-unit, backend-integration, frontend-lint-build-test]
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube's New Code analysis needs enough history to diff
          # against the reference branch (main) — see
          # docs/sonarqube-quality-gate-recommendations.md.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      # demo-setup/sonar-project.properties documents sonar.projectKey,
      # sonar.sources, and both packages' sonar.*.lcov.reportPaths — copy
      # it to the repo root as sonar-project.properties when activating
      # this workflow (see MASTERCLASS.md).
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy-filesystem-scan:
    name: Trivy / dependency vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@f9424c10c36e288d5fa79bd3dfd1aeb2d6eae808
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          # Only fail the gate on CVEs with a fix actually available —
          # see docs/sonarqube-quality-gate-recommendations.md's "What NOT
          # to do" for why this is a legitimate default, not a weakened
          # one: an un-fixable base-image CVE would otherwise make this
          # gate permanently unsatisfiable regardless of what the repo's
          # own code does.
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
